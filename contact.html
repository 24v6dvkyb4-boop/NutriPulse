<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriPulse — Contact</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23121B2B'/><rect x='10' y='40' width='10' height='20' rx='2' fill='none' stroke='%23E08B4F' stroke-width='6'/><rect x='80' y='40' width='10' height='20' rx='2' fill='none' stroke='%23E08B4F' stroke-width='6'/><rect x='25' y='30' width='15' height='40' rx='4' fill='none' stroke='%23E08B4F' stroke-width='6'/><rect x='60' y='30' width='15' height='40' rx='4' fill='none' stroke='%23E08B4F' stroke-width='6'/><line x1='40' y1='50' x2='60' y2='50' stroke='%23E08B4F' stroke-width='6' stroke-linecap='round'/></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
  body { background: #121B2B; color: #fff; line-height: 1.6; }
  a { text-decoration: none; }
  
  /* NAVBAR */
  nav { display: flex; justify-content: space-between; align-items: center; padding: 18px 40px; background: #121B2B; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #263552; }
  .nav-brand { display: flex; align-items: center; gap: 10px; }
  .nav-brand svg { width: 32px; height: 32px; filter: drop-shadow(0 0 6px rgba(224,139,79,0.4)); }
  .logo { font-size: 24px; font-weight: 800; color: #E08B4F; letter-spacing: 1px; }
  nav ul { display: flex; gap: 20px; list-style: none; }
  nav ul li a { color: #cfd8cf; font-weight: 600; font-size: 15px; transition: color 0.2s; }
  nav ul li a:hover, nav ul li a.active { color: #E08B4F; }

  /* SECTION CONTACT */
  section { padding: 80px 40px; display: flex; justify-content: center; }
  .contact-container { background: #1C2D4A; border: 1px solid #263552; border-radius: 18px; padding: 50px; width: 100%; max-width: 600px; box-shadow: 0 0 30px rgba(224,139,79,0.1); }
  
  .section-title { text-align: center; margin-bottom: 40px; }
  .section-title h1 { font-size: 38px; color: #E08B4F; margin-bottom: 10px; }
  .section-title p { color: #a0b0c8; font-size: 16px; }

  .form-group { margin-bottom: 25px; }
  .form-group label { display: block; margin-bottom: 8px; color: #cfd8cf; font-weight: 600; font-size: 15px; }
  .form-group input, .form-group textarea { width: 100%; padding: 15px; background: #121B2B; border: 1px solid #263552; border-radius: 10px; color: #fff; font-family: inherit; font-size: 15px; transition: border-color 0.2s; }
  .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #E08B4F; }
  
  .btn-submit { width: 100%; background: #E08B4F; color: #121B2B; padding: 16px; border: none; border-radius: 10px; font-weight: 800; font-size: 16px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 10px; }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(224,139,79,0.4); }

  /* FOOTER */
  footer { background: #0d1522; color: #a0b0c8; padding: 50px 40px 25px; border-top: 1px solid #263552; text-align: center; margin-top: 50px; }

  @media (max-width: 700px) {
    nav ul { display: none; }
    .contact-container { padding: 30px; }
    .section-title h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="26" width="8" height="12" rx="2" stroke="#E08B4F" stroke-width="3"/><rect x="52" y="26" width="8" height="12" rx="2" stroke="#E08B4F" stroke-width="3"/><rect x="14" y="22" width="10" height="20" rx="3" stroke="#E08B4F" stroke-width="3"/><rect x="40" y="22" width="10" height="20" rx="3" stroke="#E08B4F" stroke-width="3"/><line x1="24" y1="32" x2="40" y2="32" stroke="#E08B4F" stroke-width="3" stroke-linecap="round"/></svg>
    <div class="logo">NutriPulse</div>
  </div>
  <ul>
    <li><a href="index.html">Accueil</a></li>
    <li><a href="exercices.html">Exercices</a></li>
    <li><a href="fuel.html">Fuel (Nutrition)</a></li>
    <li><a href="suivi.html">Mon Suivi</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
</nav>

<section>
  <div class="contact-container">
    <div class="section-title">
      <h1>Contact & Publicité</h1>
      <p>Une question ? Envie de faire de la pub sur NutriPulse ? Écris-nous.</p>
    </div>
    
    <form action="#" method="POST">
      <div class="form-group">
        <label for="nom">Ton Nom ou Ton Entreprise</label>
        <input type="text" id="nom" placeholder="Ex: Nike, ou Jean Dupont" required>
      </div>
      
      <div class="form-group">
        <label for="email">Ton Email</label>
        <input type="email" id="email" placeholder="ton@email.com" required>
      </div>
      
      <div class="form-group">
        <label for="message">Ton Message</label>
        <textarea id="message" rows="5" placeholder="Explique-nous ce que tu cherches..." required></textarea>
      </div>
      
      <button type="submit" class="btn-submit">Envoyer le message</button>
    </form>
  </div>
</section>

<footer>
  <p>© 2025 NutriPulse. Tous droits réservés.</p>
</footer>

</body>
</html>
