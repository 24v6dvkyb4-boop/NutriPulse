<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriPulse — Contact</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d0d0d; color: #fff; line-height: 1.6; }
  a { text-decoration: none; }
  
  /* NAVBAR (identique à l'accueil) */
  nav { display: flex; justify-content: space-between; align-items: center; padding: 18px 40px; background: #0d0d0d; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #1f3d1f; }
  .nav-brand { display: flex; align-items: center; gap: 10px; }
  .nav-brand svg { width: 32px; height: 32px; filter: drop-shadow(0 0 6px #39ff14); }
  .logo { font-size: 24px; font-weight: 800; color: #39ff14; letter-spacing: 1px; text-shadow: 0 0 12px #39ff14; }
  nav ul { display: flex; gap: 28px; list-style: none; }
  nav ul li a { color: #cfd8cf; font-weight: 600; font-size: 15px; transition: color 0.2s; }
  nav ul li a:hover, nav ul li a.active { color: #39ff14; }
  .btn-nav { background: #39ff14; color: #0d0d0d; padding: 10px 22px; border-radius: 30px; font-weight: 800; font-size: 14px; box-shadow: 0 0 15px rgba(57,255,20,0.4); }

  /* SECTION CONTACT */
  section { padding: 80px 40px; display: flex; justify-content: center; }
  .contact-container { background: #141414; border: 1px solid #2a5c2a; border-radius: 18px; padding: 50px; width: 100%; max-width: 600px; box-shadow: 0 0 30px rgba(57,255,20,0.1); }
  
  .section-title { text-align: center; margin-bottom: 40px; }
  .section-title h1 { font-size: 38px; color: #39ff14; text-shadow: 0 0 15px rgba(57,255,20,0.4); margin-bottom: 10px; }
  .section-title p { color: #8fa394; font-size: 16px; }

  .form-group { margin-bottom: 25px; }
  .form-group label { display: block; margin-bottom: 8px; color: #cfd8cf; font-weight: 600; font-size: 15px; }
  .form-group input, .form-group textarea { width: 100%; padding: 15px; background: #0d0d0d; border: 1px solid #2a5c2a; border-radius: 10px; color: #fff; font-family: inherit; font-size: 15px; transition: border-color 0.2s, box-shadow 0.2s; }
  .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #39ff14; box-shadow: 0 0 10px rgba(57,255,20,0.2); }
  
  /* Le bouton d'envoi */
  .btn-submit { width: 100%; background: #39ff14; color: #0d0d0d; padding: 16px; border: none; border-radius: 10px; font-weight: 800; font-size: 16px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 10px; }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(57,255,20,0.4); }

  /* FOOTER */
  footer { background: #050505; color: #8fa394; padding: 50px 40px 25px; border-top: 1px solid #1f3d1f; text-align: center; margin-top: 50px; }
  .footer-bottom { border-top: 1px solid #1f3d1f; padding-top: 20px; font-size: 13px; margin-top: 20px; }

  @media (max-width: 700px) {
    nav ul { display: none; }
    .contact-container { padding: 30px; }
    .section-title h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav>
  <div class="nav-brand">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="26" width="8" height="12" rx="2" stroke="#39ff14" stroke-width="3"/>
      <rect x="52" y="26" width="8" height="12" rx="2" stroke="#39ff14" stroke-width="3"/>
      <rect x="14" y="22" width="10" height="20" rx="3" stroke="#39ff14" stroke-width="3"/>
      <rect x="40" y="22" width="10" height="20" rx="3" stroke="#39ff14" stroke-width="3"/>
      <line x1="24" y1="32" x2="40" y2="32" stroke="#39ff14" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="logo">NutriPulse</div>
  </div>
  <ul>
    <li><a href="index.html">Accueil</a></li>
    <li><a href="exercices.html">Exercices</a></li>
    <li><a href="fuel.html">Fuel (Nutrition)</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
  <a href="#" class="btn-nav">Commencer</a>
</nav>

<!-- CONTENU CONTACT -->
<section>
  <div class="contact-container">
    <div class="section-title">
      <h1>Contact & Publicité</h1>
      <p>Une question ? Envie de faire de la pub sur NutriPulse ? Écris-nous.</p>
    </div>
    
    <!-- Le formulaire -->
    <form action="#" method="POST">
      <div class="form-group">
        <label for="nom">Ton Nom ou Ton Entreprise</label>
        <input type="text" id="nom" placeholder="Ex: Nike, ou Jean Dupont" required>
      </div>
      
      <div class="form-group">
        <label for="email">Ton Email</label>
        <input type="email" id="email" placeholder="ton@email.com" required>
      </div>
      
      <div class="form-group">
        <label for="message">Ton Message</label>
        <textarea id="message" rows="5" placeholder="Explique-nous ce que tu cherches..." required></textarea>
      </div>
      
      <button type="submit" class="btn-submit">Envoyer le message</button>
    </form>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="nav-brand" style="justify-content: center; margin-bottom: 10px;">
    <div class="logo" style="font-size: 20px;">NutriPulse</div>
  </div>
  <p style="font-size: 14px;">© 2025 NutriPulse. Tous droits réservés.</p>
  <div class="footer-bottom">Fait avec passion pour ton équilibre.</div>
</footer>

</body>
</html>
